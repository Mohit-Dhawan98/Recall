<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .header {
      padding: 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #818cf8;
    }

    .logo {
      width: 24px;
      height: 24px;
    }

    .content {
      padding: 16px;
    }

    .page-info {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .page-url {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #6366f1;
      color: white;
    }

    .btn-primary:hover {
      background: #4f46e5;
    }

    .btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: #94a3b8;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #334155;
      color: #e2e8f0;
    }

    .status {
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
    }

    .status.success {
      background: #166534;
      color: #86efac;
    }

    .status.error {
      background: #991b1b;
      color: #fca5a5;
    }

    .status.loading {
      background: #1e40af;
      color: #93c5fd;
    }

    .footer {
      padding: 12px 16px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
    }

    .footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .shortcut {
      font-size: 11px;
      color: #64748b;
      margin-top: 16px;
      text-align: center;
    }

    kbd {
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="20" fill="#1a1a2e"/>
      <circle cx="50" cy="50" r="25" fill="none" stroke="#6366f1" stroke-width="4"/>
      <circle cx="50" cy="50" r="8" fill="#6366f1"/>
    </svg>
    <h1>Recall</h1>
  </div>

  <div class="content">
    <div class="page-info">
      <div class="page-title" id="pageTitle">Loading...</div>
      <div class="page-url" id="pageUrl"></div>
    </div>

    <button class="btn btn-primary" id="saveBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save to Recall
    </button>

    <button class="btn btn-secondary" id="openAppBtn">
      Open Recall
    </button>

    <div class="status" id="status" style="display: none;"></div>

    <div class="shortcut">
      Shortcut: <kbd>Cmd</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>
    </div>
  </div>

  <div class="footer">
    <span>v1.0.0</span>
    <a href="#" id="settingsLink">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
