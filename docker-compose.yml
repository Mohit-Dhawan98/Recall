version: '3.8'

services:
  # Frontend (React + PWA)
  web:
    build: ./frontend
    environment:
      - VITE_API_URL=${PUBLIC_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Backend API
  api:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/recall
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Telegram Bot (optional)
  bot:
    build: ./bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://api:8000
      - WEBHOOK_URL=${PUBLIC_URL}/api/telegram/webhook
      - USE_POLLING=${USE_POLLING:-true}
    depends_on:
      - api
    profiles:
      - with-bot

  # Database
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=recall
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recall"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local LLM (optional)
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    profiles:
      - local-llm

  # Tunnel Options (pick one)
  cloudflare-tunnel:
    image: cloudflare/cloudflared
    command: tunnel --url http://web:3000
    restart: always
    profiles:
      - tunnel-cloudflare

  tailscale:
    image: tailscale/tailscale
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_HOSTNAME=recall
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    profiles:
      - tunnel-tailscale

volumes:
  pgdata:
  ollama_data:
  tailscale_data:
